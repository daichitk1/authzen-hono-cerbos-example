name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run repository checks
        run: pnpm check

  cerbos-policy:
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile Cerbos policies
        run: pnpm cerbos:compile

      - name: Start Cerbos
        run: pnpm cerbos:up

      - name: Run AuthZEN policy matrix
        run: pnpm test:cerbos

      - name: Show Cerbos logs on failure
        if: failure()
        run: pnpm cerbos:logs

      - name: Stop Cerbos
        if: always()
        run: pnpm cerbos:down

  integration-e2e:
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    needs: [validate, cerbos-policy]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start Cerbos
        run: pnpm cerbos:up

      - name: Run Hono and PDP failure integration tests
        run: pnpm test:integration

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser E2E and capture evidence
        run: pnpm test:e2e

      - name: Upload screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authorization-evidence
          path: docs/evidence/*.png
          if-no-files-found: error
          retention-days: 14

      - name: Stop Cerbos before fail-closed test
        run: pnpm cerbos:down

      - name: Run Cerbos-stopped fail-closed test
        run: pnpm test:fail-closed

      - name: Show Cerbos logs on failure
        if: failure()
        run: pnpm cerbos:logs

      - name: Stop Cerbos
        if: always()
        run: pnpm cerbos:down

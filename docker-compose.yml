services:
  cerbos:
    image: ${CERBOS_IMAGE:-ghcr.io/cerbos/cerbos:0.55.0}
    command: ['server', '--config=/config/conf.yaml']
    environment:
      CERBOS_NO_TELEMETRY: '1'
    ports:
      - '127.0.0.1:3592:3592'
      - '127.0.0.1:3593:3593'
    volumes:
      - ./cerbos/conf.yaml:/config/conf.yaml:ro
      - ./cerbos/policies:/policies:ro
    healthcheck:
      test: ['CMD', '/cerbos', 'healthcheck']
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 2s
